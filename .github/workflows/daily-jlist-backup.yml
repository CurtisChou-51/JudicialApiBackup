name: Daily JList Backup

on:
  schedule:
    - cron: '0 18 * * *'  # UTC 18:00 = 台北時間 02:00，依實際需求調整
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 執行登入與備份
        run: node index.js
        env:
          API_USER: ${{ secrets.API_USER }}
          API_MIMA: ${{ secrets.API_MIMA }}

      - name: Commit 備份檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jlist/
          git diff --cached --quiet || git commit -m "chore: jlist backup $(date -u +%F)"
          git push
